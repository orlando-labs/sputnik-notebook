name: sputnik-notebook
x-common: &common
  image: ${NOTEBOOK_IMAGE:?Select an immutable image digest}
  restart: unless-stopped
  user: "10197:10197"
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  pids_limit: 256
  environment: &environment
    MALLOC_ARENA_MAX: "2"
    SPUTNIK_TASK_MAX_THREADS: "16"
    SPUTNIK_FFI_MAX_THREADS: "16"
    SPUTNIK_PKG_HOME: /var/lib/notebook-packages
    SPUTNIK_NATIVE_RT_CACHE: /var/cache/notebook/native-runtime
    SPUTNIK_NATIVE_EXT_CACHE: /var/cache/notebook/native-extensions
    SPUTNIK_VM_CACHE: /var/cache/notebook/vm
  tmpfs:
    - /tmp:rw,nosuid,size=128m
  logging:
    driver: json-file
    options: {max-size: "10m", max-file: "3"}
services:
  core:
    <<: *common
    mem_limit: 2g
    cpus: 4
    entrypoint: [/usr/bin/tini, --, /usr/local/bin/sputnik-notebook-remote]
    command: [--mode, agent, --root, /var/lib/notebook-core, --worker, /usr/local/bin/sputnik-notebook-worker, --sputnik, /usr/local/bin/sputnik, --policy-file, /etc/notebook/core-policy.json]
    healthcheck:
      test: [CMD, /usr/local/bin/notebook-public-template, --core-root, /var/lib/notebook-core, --health-only]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 3
    volumes:
      - /md0/sputnik-notebook/core:/var/lib/notebook-core:rw,z
      - /md0/sputnik-notebook/packages:/var/lib/notebook-packages:rw,z
      - /md0/sputnik-notebook/cache-core:/var/cache/notebook:rw,z
      - /md0/sputnik-notebook/config:/etc/notebook:ro,z
  web:
    <<: *common
    mem_limit: 1g
    cpus: 2
    depends_on:
      core: {condition: service_healthy}
    env_file: [/md0/sputnik-notebook/config/web.env]
    environment:
      <<: *environment
      ORBIT_HOST: 0.0.0.0
      ORBIT_PORT: "3000"
      ORBIT_ORIGIN: https://notebook.sputnik-lang.online
      ORBIT_TRUSTED_PROXY_CIDRS: 127.0.0.1/32,192.168.1.155/32
      NOTEBOOK_CORE_ROOT: /var/lib/notebook-core
      NOTEBOOK_WEB_DATABASE: /var/lib/notebook-web/catalog.sqlite
      NOTEBOOK_PUBLIC_TEMPLATES: /etc/notebook/public-templates.json
    command: [--mode, production, --behind-proxy, --public-only]
    ports: ["192.168.1.97:18197:3000"]
    volumes:
      - /md0/sputnik-notebook/core:/var/lib/notebook-core:ro,z
      - /md0/sputnik-notebook/web:/var/lib/notebook-web:rw,z
      - /md0/sputnik-notebook/cache-web:/var/cache/notebook:rw,z
      - /md0/sputnik-notebook/config:/etc/notebook:ro,z
