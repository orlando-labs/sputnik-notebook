# Installed only for notebook.sputnik-lang.online on 192.168.1.155.
# OAuth authorization codes must not enter access logs.
log_format notebook_no_query '$remote_addr [$time_local] "$request_method $uri $server_protocol" $status $body_bytes_sent';

server {
    listen 80;
    server_name notebook.sputnik-lang.online;
    location ^~ /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location / { return 308 https://notebook.sputnik-lang.online$request_uri; }
}

server {
    listen 443 ssl;
    server_name notebook.sputnik-lang.online;
    ssl_certificate /etc/letsencrypt/live/notebook.sputnik-lang.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/notebook.sputnik-lang.online/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    server_tokens off;
    root /srv/sputnik-notebook/public;
    client_max_body_size 112m;
    access_log /var/log/nginx/sputnik-notebook.access.log notebook_no_query;
    error_log /var/log/nginx/sputnik-notebook.error.log;
    add_header Strict-Transport-Security "max-age=31536000" always;

    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options nosniff;
    }
    location ~ ^/(\.vite|\.sputnik|build|db|backend|test|deploy)(/|$) { return 404; }

    location / {
        proxy_pass http://192.168.1.97:18197;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_cache off;
        proxy_next_upstream off;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
